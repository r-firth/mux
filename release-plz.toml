[workspace]
git_only = true
release = false
release_always = false
semver_check = false
pr_labels = ["release"]
git_tag_name = "v{{ version }}"
git_release_name = "Mux v{{ version }}"

[[package]]
name = "mux"
release = true
git_only = true
changelog_path = "CHANGELOG.md"
changelog_include = [
    "mux-acp",
    "mux-client",
    "mux-daemon",
    "mux-protocol",
    "mux-terminal",
    "mux-terminal-ghostty",
    "mux-workspace",
    "muxctl",
]

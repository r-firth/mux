[package]
name = "mux"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
product = [
    "mux-daemon/ghostty-vendored",
    "mux-terminal-ghostty/vendored",
]

[dependencies]
anyhow.workspace = true
arboard.workspace = true
async-channel.workspace = true
directories.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
mux-acp = { path = "../../crates/mux-acp" }
mux-client = { path = "../../crates/mux-client" }
mux-daemon = { path = "../../crates/mux-daemon", default-features = false }
mux-protocol = { path = "../../crates/mux-protocol" }
mux-terminal = { path = "../../crates/mux-terminal" }
mux-terminal-ghostty = { path = "../../crates/mux-terminal-ghostty", default-features = false }
mux-workspace = { path = "../../crates/mux-workspace" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "mux"
path = "src/gpui_main.rs"
required-features = ["product"]

[package]
name = "mux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
product = [
    "mux-daemon/ghostty-vendored",
    "mux-terminal-ghostty/vendored",
]

[dependencies]
anyhow.workspace = true
arboard.workspace = true
bytemuck.workspace = true
directories.workspace = true
glyphon.workspace = true
mux-acp = { path = "../../crates/mux-acp" }
mux-client = { path = "../../crates/mux-client" }
mux-daemon = { path = "../../crates/mux-daemon", default-features = false }
mux-protocol = { path = "../../crates/mux-protocol" }
mux-terminal = { path = "../../crates/mux-terminal" }
mux-terminal-ghostty = { path = "../../crates/mux-terminal-ghostty", default-features = false }
mux-workspace = { path = "../../crates/mux-workspace" }
pollster.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true
winit.workspace = true

[lints]
workspace = true

[[bin]]
name = "mux"
path = "src/main.rs"
required-features = ["product"]

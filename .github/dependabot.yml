version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
    ignore:
      # These packages sit directly on latency-, rendering-, or MSRV-critical
      # paths. Upgrade them deliberately with native-product validation.
      - dependency-name: glyphon
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: pollster
        update-types: ["version-update:semver-major"]
      - dependency-name: sysinfo
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: wgpu
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # This revision selects the project's Rust toolchain, not merely the
      # action implementation. rust-toolchain.toml is the source of truth.
      - dependency-name: dtolnay/rust-toolchain

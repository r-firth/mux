version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # This revision selects the project's Rust toolchain, not merely the
      # action implementation. rust-toolchain.toml is the source of truth.
      - dependency-name: dtolnay/rust-toolchain

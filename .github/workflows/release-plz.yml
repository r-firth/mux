name: Release management

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    name: Publish approved release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Publish GitHub release
        id: publish
        run: scripts/publish-github-release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MUX_RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - name: Build release artifacts
        if: steps.publish.outputs.artifacts_needed == 'true'
        run: gh workflow run release-artifacts.yml --ref main -f tag='${{ steps.publish.outputs.tag }}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    name: Prepare release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release-please-main
      cancel-in-progress: false
    steps:
      - name: Create or update release PR
        uses: googleapis/release-please-action@v5
        with:
          skip-github-release: true
          token: ${{ secrets.GITHUB_TOKEN }}

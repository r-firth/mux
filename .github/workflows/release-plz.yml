name: Release management

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: Publish approved release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - &checkout
        name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - &rust
        name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Publish GitHub release
        id: publish
        run: scripts/publish-github-release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release artifacts
        if: steps.publish.outputs.artifacts_needed == 'true'
        run: gh workflow run release-artifacts.yml --ref main -f tag='${{ steps.publish.outputs.tag }}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-pr:
    name: Prepare release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *rust
      - name: Create or update release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

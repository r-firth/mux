[workspace]
members = [
    "apps/mux",
    "apps/muxctl",
    "crates/mux-acp",
    "crates/mux-client",
    "crates/mux-daemon",
    "crates/mux-protocol",
    "crates/mux-terminal",
    "crates/mux-terminal-ghostty",
    "crates/mux-workspace",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
agent-client-protocol = "2.0.0"
anyhow = "1.0.99"
arboard = { version = "3.6.1", default-features = false }
async-channel = "2.5.0"
cc = "1.2.33"
clap = { version = "4.5.45", features = ["derive"] }
directories = "6.0.0"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
parking_lot = "0.12.4"
portable-pty = "0.9.0"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
tempfile = "3.20.0"
thiserror = "2.0.14"
tokio = { version = "1.47.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
uuid = { version = "1.18.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

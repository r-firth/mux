[workspace]
members = [
    "apps/mux",
    "apps/muxctl",
    "crates/mux-acp",
    "crates/mux-client",
    "crates/mux-daemon",
    "crates/mux-protocol",
    "crates/mux-terminal",
    "crates/mux-terminal-ghostty",
    "crates/mux-workspace",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
agent-client-protocol = "2.0.0"
anyhow = "1.0.99"
arboard = { version = "3.6.1", default-features = false }
async-channel = "2.5.0"
bezel = { git = "https://github.com/crabtalk/bezel", rev = "86b8997c0601ebcd416632ebde33d78f82b05917" }
bezel-markdown = { git = "https://github.com/crabtalk/bezel", rev = "86b8997c0601ebcd416632ebde33d78f82b05917" }
cc = "1.2.33"
clap = { version = "4.5.45", features = ["derive"] }
directories = "6.0.0"
gpui = { git = "https://github.com/crabtalk/zed", rev = "e0b415b4bcffe4a2f05221544a788d482f5f6f50", version = "0.2.2" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "222cf9644fbfd9bdff970a0308f9ce216b2c0818" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "222cf9644fbfd9bdff970a0308f9ce216b2c0818" }
gpui_platform = { git = "https://github.com/crabtalk/zed", rev = "e0b415b4bcffe4a2f05221544a788d482f5f6f50", features = ["font-kit"] }
ignore = "0.4.23"
indexmap = "2.14.0"
objc2-app-kit = { version = "0.3.2", default-features = false }
parking_lot = "0.12.4"
portable-pty = "0.9.0"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
tempfile = "3.20.0"
thiserror = "2.0.14"
tokio = { version = "1.47.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.0", features = ["serde", "v4"] }

[patch.crates-io]
gpui = { git = "https://github.com/crabtalk/zed", rev = "e0b415b4bcffe4a2f05221544a788d482f5f6f50", version = "0.2.2" }

[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/crabtalk/zed", rev = "e0b415b4bcffe4a2f05221544a788d482f5f6f50", version = "0.2.2" }
gpui_macros = { git = "https://github.com/crabtalk/zed", rev = "e0b415b4bcffe4a2f05221544a788d482f5f6f50" }
gpui_platform = { git = "https://github.com/crabtalk/zed", rev = "e0b415b4bcffe4a2f05221544a788d482f5f6f50" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

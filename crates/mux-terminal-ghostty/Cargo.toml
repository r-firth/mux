[package]
name = "mux-terminal-ghostty"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[package.metadata.cargo-machete]
# cargo-machete does not recognize the cc::Build use in build.rs.
ignored = ["cc"]

[features]
default = []
link = []
vendored = ["link"]

[dependencies]
directories.workspace = true
mux-terminal = { path = "../mux-terminal" }
thiserror.workspace = true

[build-dependencies]
cc.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dev-dependencies]
tempfile.workspace = true

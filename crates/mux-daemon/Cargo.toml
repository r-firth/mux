[package]
name = "mux-daemon"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
ghostty = ["dep:mux-terminal-ghostty", "mux-terminal-ghostty/link"]
ghostty-vendored = ["ghostty", "mux-terminal-ghostty/vendored"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
mux-protocol = { path = "../mux-protocol" }
mux-acp = { path = "../mux-acp" }
mux-terminal = { path = "../mux-terminal" }
mux-terminal-ghostty = { path = "../mux-terminal-ghostty", optional = true }
mux-workspace = { path = "../mux-workspace" }
parking_lot.workspace = true
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
mux-client = { path = "../mux-client" }
tempfile.workspace = true

[lints]
workspace = true

[[bin]]
name = "muxd"
path = "src/bin/muxd.rs"
